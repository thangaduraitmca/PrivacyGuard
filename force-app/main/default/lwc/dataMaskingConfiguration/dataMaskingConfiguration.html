<template>
<div class="workspace">
 <template if:true={loading}><lightning-spinner alternative-text="Working" size="medium"></lightning-spinner></template>
 <header class="hero slds-grid slds-wrap slds-grid_align-spread slds-grid_vertical-align-center">
  <div class="pg-header-copy"><span class="pg-header-icon pg-header-icon--purple" aria-hidden="true"><lightning-icon icon-name="utility:database" size="medium" alternative-text=""></lightning-icon></span><div class="pg-header-text"><div class="eyebrow">PRIVACYGUARD • MASKING SETUP</div><h1>Data Masking Configuration</h1><p>Configure field masking rules.</p></div></div>
  <lightning-button variant="brand" icon-name="utility:add" label="Add Fields" onclick={openAdd}></lightning-button>
 </header>
 <div class="metrics">
  <article><span>{objectCount}</span><small>Objects</small></article><article><span>{fieldCount}</span><small>Configured fields</small></article><article><span>{activeCount}</span><small>Active</small></article><article class="attention"><span>{needsStrategyCount}</span><small>Need strategy</small></article>
 </div>
 <template if:true={needsStrategyCount}><div class="notice"><lightning-icon icon-name="utility:warning" size="x-small"></lightning-icon><span>{needsStrategyCount} field(s) need a masking strategy before they can be activated.</span></div></template>
 <template if:true={errorCount}><div class="pg-error-summary">{errorCount} field(s) need attention. Select Errors to review.</div></template>
 <div class="toolbar slds-grid slds-wrap slds-gutters_small slds-grid_vertical-align-end">
  <div class="slds-col slds-grow"><lightning-input type="search" variant="label-hidden" placeholder="Search object or field" onchange={searchChanged}></lightning-input></div>
  <div class="filter"><lightning-combobox variant="label-hidden" value={statusFilter} options={statusOptions} onchange={filterChanged}></lightning-combobox></div>
  <lightning-button label="Expand All" onclick={expandAll}></lightning-button><lightning-button label="Collapse All" onclick={collapseAll}></lightning-button>
 </div>
 <template if:true={hasGroups}><div class="object-list"><template for:each={groups} for:item="g"><section key={g.name} class="object-card">
  <button class="object-header" data-name={g.name} onclick={toggle}><lightning-icon icon-name={g.chevron} size="x-small"></lightning-icon><span class="object-name">{g.name}</span><span class="count">{g.count} fields</span></button>
  <template if:true={g.expanded}><div class="table-wrap"><table class="slds-table slds-table_cell-buffer"><thead><tr><th>Field</th><th>Type</th><th>Masking strategy</th><th>Pattern / value</th><th>Source</th><th>Active</th><th></th></tr></thead><tbody>
   <template for:each={g.rows} for:item="r"><tr key={r.id}><td><strong>{r.fieldLabel}</strong><div class="api-name">{r.fieldApiName}</div></td><td><span class="type-pill">{r.fieldType}</span></td><td><template if:true={r.unsupported}><span class="slds-badge" title={r.unsupportedReason}>Not supported</span><div class="slds-text-body_small slds-text-color_weak">{r.unsupportedReason}</div></template><template if:false={r.unsupported}><lightning-combobox variant="label-hidden" data-id={r.id} value={r.strategy} options={r.strategyOptions} onchange={strategyChanged}></lightning-combobox></template></td><td><template if:false={r.unsupported}><lightning-input variant="label-hidden" data-id={r.id} value={r.pattern} placeholder={r.patternPlaceholder} required={r.patternRequired} disabled={r.patternDisabled} onchange={patternChanged}></lightning-input><template if:true={r.patternHelp}><div class="slds-text-body_small slds-text-color_weak slds-m-top_x-small">{r.patternHelp}</div></template></template><template if:true={r.unsupported}><span class="slds-text-color_weak">—</span></template></td><td><span class="source-pill">{r.source}</span></td><td><template if:false={r.unsupported}><lightning-input type="toggle" variant="label-hidden" data-id={r.id} checked={r.active} onchange={activeChanged}></lightning-input></template><template if:true={r.unsupported}><span class="slds-text-color_weak">Excluded</span></template></td><td><lightning-button-icon icon-name="utility:delete" variant="bare" alternative-text="Remove configuration" title="Remove configuration" data-id={r.id} onclick={requestDelete}></lightning-button-icon></td></tr><template if:true={r.errorMessage}><tr key={r.errorKey} class="pg-error-row"><td colspan="7"><lightning-icon icon-name="utility:error" size="x-small" alternative-text="Validation error"></lightning-icon><span>{r.objectApiName} → {r.fieldLabel} ({r.fieldApiName}): {r.errorMessage}</span></td></tr></template></template>
  </tbody></table></div></template></section></template></div></template>
 <template if:false={hasGroups}><div class="empty"><lightning-icon icon-name="utility:shield" size="large"></lightning-icon><h2>No masking fields configured</h2><p>Accept fields in PII Scan Review or add fields manually to start building your masking scope.</p><lightning-button variant="brand" label="Add Fields" onclick={openAdd}></lightning-button></div></template>
 <div class="savebar"><span class="savehint">Accepted PII fields are added here automatically and remain inactive until configured.</span><lightning-button variant="brand" label="Save Changes" disabled={saveDisabled} onclick={saveExisting}></lightning-button></div>
</div>
<template if:true={showAdd}><section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open"><div class="slds-modal__container"><header class="slds-modal__header"><h2 class="slds-text-heading_medium">Add fields manually</h2><p class="slds-m-top_x-small">Choose an object, then select one or more eligible fields.</p></header><div class="slds-modal__content slds-p-around_medium"><lightning-combobox label="Object" options={objectOptions} value={selectedObject} onchange={objectChanged}></lightning-combobox><lightning-dual-listbox class="slds-m-top_medium" label="Fields" source-label="Available" selected-label="Selected" options={fieldOptions} value={selectedFields} onchange={fieldsChanged}></lightning-dual-listbox></div><footer class="slds-modal__footer"><lightning-button label="Cancel" onclick={closeAdd}></lightning-button><lightning-button class="slds-m-left_small" variant="brand" label="Add Selected" onclick={addSelected}></lightning-button></footer></div></section><div class="slds-backdrop slds-backdrop_open"></div></template>
<template if:true={showDelete}><section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open"><div class="slds-modal__container confirm"><header class="slds-modal__header"><h2 class="slds-text-heading_medium">Remove masking configuration?</h2></header><div class="slds-modal__content slds-p-around_large"><p>This field will no longer be included in masking execution. PII discovery and audit history are retained.</p></div><footer class="slds-modal__footer"><lightning-button label="Cancel" onclick={cancelDelete}></lightning-button><lightning-button class="slds-m-left_small" variant="destructive" label="Remove" onclick={confirmDelete}></lightning-button></footer></div></section><div class="slds-backdrop slds-backdrop_open"></div></template>
</template>
