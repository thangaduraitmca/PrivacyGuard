<template>
<section class="pg-feature-hero" aria-label="PII Discovery & Review"><div class="pg-header-copy"><span class="pg-header-icon pg-header-icon--orange" aria-hidden="true"><lightning-icon icon-name="utility:search" size="medium" alternative-text=""></lightning-icon></span><div class="pg-header-text"><div class="pg-feature-eyebrow">PRIVACYGUARD • PII DISCOVERY</div><h1>PII Discovery & Review</h1><p>Find and review sensitive fields before masking.</p></div></div><div class="pg-header-actions"><lightning-button label="Run New Scan" onclick={handleRunScan} disabled={scanRunning}></lightning-button></div></section>
<lightning-card title="PII Discovery & Review" icon-name="standard:scan_card">

<div class="workspace">
<p class="intro">PrivacyGuard identifies potential candidates only. Administrators decide the final masking scope. Discovery checks field types, keywords and Salesforce Data Classification. Compliance tags and Confidential, Restricted or Mission Critical sensitivity levels identify candidates for review. No masking strategy is assigned automatically.</p>
<template if:true={showScanPanel}><section class="status-panel"><div class="status-title"><template if:true={scanRunning}><lightning-spinner alternative-text="PII discovery running" size="small"></lightning-spinner></template><strong>PII Discovery: {scanStatusLabel}</strong></div><lightning-progress-bar value={progressValue} size="large"></lightning-progress-bar><div class="metrics"><span>Objects <strong>{scanStatus.processed}/{scanStatus.total}</strong></span><span>Candidates <strong>{scanStatus.candidatesFound}</strong></span><span>Errors <strong>{scanStatus.errors}</strong></span><span>Progress <strong>{progressValue}%</strong></span></div><div class="job">Job: {scanStatus.jobId}</div><template if:true={scanStatus.classificationWarning}><div class="slds-notify slds-notify_alert slds-alert_warning slds-m-top_small" role="alert">{scanStatus.classificationWarning}</div></template></section></template>
<div class="summary-grid"><div class="summary"><span class="num">{objectCount}</span><span>Objects with candidates</span></div><div class="summary"><span class="num">{candidateCount}</span><span>Visible candidates</span></div><div class="summary"><span class="num">{acceptedCount}</span><span>Accepted</span></div><div class="summary"><span class="num">{removedCount}</span><span>Removed</span></div></div>
<div class="toolbar"><lightning-input type="search" label="Search" variant="label-hidden" placeholder="Search object, field, label, type or reason" onchange={handleSearch}></lightning-input><lightning-combobox label="Status" variant="label-hidden" value={statusFilter} options={statusOptions} onchange={handleFilterChange}></lightning-combobox><lightning-button label={acceptSelectedLabel} variant="brand" disabled={noSelection} onclick={handleAccept}></lightning-button><lightning-button label={removeSelectedLabel} disabled={noSelection} onclick={handleRemove}></lightning-button></div>
<template if:true={isLoading}><lightning-spinner alternative-text="Loading" size="small"></lightning-spinner></template>
<template if:true={hasResults}><div class="object-list"><template for:each={objectGroups} for:item="group"><article key={group.name} class="object-card"><header class="object-header"><button class="expand" data-object={group.name} onclick={toggleObject}><lightning-icon icon-name={group.icon} size="x-small"></lightning-icon><span class="object-name">{group.name}</span><span class="pill">{group.count} candidates</span></button><div class="object-actions"><lightning-button label="Select All" data-object={group.name} onclick={selectObject}></lightning-button><lightning-button label="Accept Object" data-object={group.name} onclick={acceptObject}></lightning-button><lightning-button label="Remove Object" data-object={group.name} onclick={removeObject}></lightning-button></div></header><template if:true={group.expanded}><div class="field-head"><span></span><span>Field</span><span>Label</span><span>Type</span><span>Why identified</span><span>Configured</span><span>Status</span></div><template for:each={group.rows} for:item="row"><div key={row.id} class="field-row"><lightning-input type="checkbox" variant="label-hidden" data-id={row.id} checked={row.selected} onchange={handleCandidateSelect}></lightning-input><div><strong>{row.fieldApiName}</strong></div><div>{row.fieldLabel}</div><div><span class="type-pill">{row.salesforceFieldType}</span></div><div>{row.detectionReason}<template if:true={row.nativeComplianceTag}><div class="slds-text-body_small slds-text-color_weak">{row.nativeComplianceTag}</div></template></div><div><lightning-input type="checkbox" variant="label-hidden" checked={row.alreadyConfigured} disabled></lightning-input></div><div><span class="status-pill">{row.reviewStatus}</span></div></div></template></template></article></template></div></template>
<template if:false={hasResults}><div class="empty">No candidates match the current status/search. Change the filter or run a new scan.</div></template>
</div></lightning-card>

</template>
