<template>
<div class="shell"><aside class="sidebar"><div class="brand"><span class="brand-icon" aria-hidden="true"><svg viewBox="0 0 48 52" width="35" height="38" xmlns="http://www.w3.org/2000/svg"><path d="M24 3 43 10v14c0 13-8 21-19 25C13 45 5 37 5 24V10Z" fill="#0f62ac" stroke="#65e9ff" stroke-width="2.5"/><path d="M24 13 36 26 24 39 12 26Z" fill="#48d9f4"/><path d="M24 19 30 26 24 33 18 26Z" fill="#e7fbff"/></svg></span><span class="brand-wordmark">PRIVACY<span>GUARD</span></span></div><nav aria-label="PrivacyGuard navigation"><template for:each={navigation} for:item="item"><button key={item.id} class={item.className} data-section={item.id} aria-current={item.selected} onclick={navigate}><lightning-icon icon-name={item.icon} size="small" alternative-text=""></lightning-icon><span>{item.label}</span></button></template></nav><div class="sidebar-footer">PrivacyGuard · Sandbox protection</div></aside>
<main class="main"><template lwc:if={isOverview}><div class="heading"><div class="pg-header-copy"><span class="pg-header-icon pg-header-icon--blue" aria-hidden="true"><lightning-icon icon-name="utility:apps" size="medium" alternative-text=""></lightning-icon></span><div class="pg-header-text"><div class="eyebrow">PRIVACYGUARD • OVERVIEW</div><h1>Dashboard</h1><p>Monitor data privacy and masking status.</p></div></div><div class={statusClass}><span class="status-dot"></span>Data Privacy: {privacyStatus}</div></div>
<template if:true={dataWarning}><div class="notice" role="status">{dataWarning}</div></template>
<template if:true={loading}><lightning-spinner alternative-text="Loading dashboard" size="medium"></lightning-spinner></template><template if:true={error}><div class="notice" role="alert">{error}</div></template>
<section class="metrics" aria-label="Privacy metrics"><article class="metric"><div class="metric-icon green"><lightning-icon icon-name="utility:shield" size="small"></lightning-icon></div><div class="metric-label">MASKING COVERAGE</div><div class="metric-value">{coverageLabel}</div><div class="metric-note">Accepted fields with active configuration</div></article><article class="metric"><div class="metric-icon blue"><lightning-icon icon-name="utility:database" size="small"></lightning-icon></div><div class="metric-label">OBJECTS CONFIGURED</div><div class="metric-value">{objectsConfigured}</div><div class="metric-note">With active masking fields</div></article><article class="metric"><div class="metric-icon cyan"><lightning-icon icon-name="utility:identity" size="small"></lightning-icon></div><div class="metric-label">FIELDS CONFIGURED</div><div class="metric-value">{fieldsConfigured}</div><div class="metric-note">Active field configurations</div></article><article class="metric status-metric"><div class="metric-icon green"><lightning-icon icon-name="utility:check" size="small"></lightning-icon></div><div class="metric-label">DATA PRIVACY</div><div class="metric-value status-value">{privacyStatus}</div><div class="metric-note">Based on available configuration and runs</div></article></section>
<section class="panels"><article class="panel"><h2>Protection Coverage</h2><p>Accepted PII fields with active masking configurations</p><div class="coverage-line"><strong>{coverageLabel}</strong></div><div class="progress" role="progressbar" aria-label="Configuration coverage" aria-valuemin="0" aria-valuemax="100" aria-valuenow={coverage}><div class="progress-fill" style={coverageStyle}></div></div><div class="coverage-cards"><div><strong>{acceptedFields}</strong><span>ACCEPTED</span></div><div><strong>{protectedFields}</strong><span>CONFIGURED</span></div><div><strong>{reviewFields}</strong><span>REVIEW</span></div></div><p class="footnote">Configuration coverage is not proof that data was masked.</p></article><article class="panel"><h2>Privacy Status</h2><div class="privacy-center"><div class="ring"><lightning-icon icon-name="utility:shield" size="large"></lightning-icon></div><div><strong>{privacyStatus}</strong><p>{privacyExplanation}</p></div></div><div class="run-info">Completed runs: <strong>{completedRuns}</strong> · Failed/error runs: <strong>{failedRuns}</strong></div></article></section>
<section class="panel activity"><div class="activity-title"><h2>Recent Masking Activity</h2><button onclick={refresh} title="Refresh dashboard"><lightning-icon icon-name="utility:refresh" size="x-small"></lightning-icon> Refresh</button></div><template if:true={hasRuns}><div class="runs"><template for:each={runs} for:item="run"><div class="run" key={run.id}><div><strong>{run.name}</strong><span>{run.started}</span></div><span class={run.statusClass}>{run.status}</span></div></template></div></template><template if:false={hasRuns}><p>No masking job runs found. Create and run a masking job to see activity here.</p></template></section>
</template>
<template lwc:elseif={isDiscovery}><c-pii-scan-review></c-pii-scan-review></template>
<template lwc:elseif={isConfig}><c-data-masking-configuration></c-data-masking-configuration></template>
<template lwc:elseif={isJobs}><c-masking-control-panel></c-masking-control-panel></template>
<template lwc:elseif={isKeywords}><c-pii-keyword-configuration></c-pii-keyword-configuration></template>
<template lwc:elseif={isAutomation}><c-automation-management></c-automation-management></template>
<template lwc:elseif={isPurge}><c-attachment-file-purge></c-attachment-file-purge></template>
<template lwc:elseif={isLogs}><div class="panel"><h2>Audit Logs</h2><p>View masking execution records in the existing Masking Logs Salesforce tab. The log viewer is backed by a Salesforce object, not an LWC, and needs a dedicated list component to be embedded here.</p><lightning-button label="Open Masking Logs" onclick={openLogs}></lightning-button></div></template>
</main></div></template>
