<template>
    <section class="hero"><div><div class="eyebrow">PRIVACYGUARD · GOVERNANCE</div><h1>Audit Centre</h1><p>Every operation has a story. Review execution activity and configuration changes.</p></div><lightning-icon icon-name="utility:shield" size="large" alternative-text="Audit governance"></lightning-icon></section>
    <section class="workspace">
        <div class="toolbar"><div><h2>Activity explorer</h2><p>Filter by workflow, find an operator, and inspect the details.</p></div><div class="actions"><lightning-button data-refresh label="Refresh / Apply" icon-name="utility:refresh" onclick={refresh} disabled={busy}></lightning-button><lightning-button label="Export loaded rows" icon-name="utility:download" onclick={exportCsv} disabled={exportDisabled}></lightning-button></div></div>
        <div class="filters"><lightning-combobox label="Category" value={category} options={categories} data-filter="category" onchange={handleFilter} disabled={busy}></lightning-combobox><lightning-combobox label="Status" value={status} options={statuses} data-filter="status" onchange={handleFilter} disabled={busy}></lightning-combobox><lightning-input type="date" label="From" value={fromDate} data-filter="fromDate" onchange={handleFilter} disabled={busy}></lightning-input><lightning-input type="date" label="To" value={toDate} data-filter="toDate" onchange={handleFilter} disabled={busy}></lightning-input><lightning-input type="search" label="User name" value={actor} data-filter="actor" onchange={handleFilter} disabled={busy}></lightning-input><lightning-input type="search" label="Job, object, field or record ID" value={search} data-filter="search" onchange={handleFilter} disabled={busy}></lightning-input></div>
        <div class="metrics"><article><span>ACTIVITY LOADED</span><strong>{loaded}</strong></article><article><span>FAILED ENTRIES LOADED</span><strong>{failed}</strong></article><article><span>CONFIG / JOB CHANGES LOADED</span><strong>{changes}</strong></article></div>
        <p class="scope">Showing records available to your user. New configuration history starts after this update is deployed. Older categories may be inferred from the log source. Dates use your Salesforce timezone. Counts and exports cover loaded rows only; use Load more for older activity.</p>
        <template if:true={error}><div class="error" role="alert">{error}</div></template>
        <template if:true={busy}><div class="loading"><lightning-spinner alternative-text="Loading audit activity" size="small"></lightning-spinner></div></template>
        <template if:true={hasRows}><div class="table"><lightning-datatable key-field="id" data={rows} columns={columns} hide-checkbox-column onrowaction={showDetail}></lightning-datatable></div></template>
        <template if:true={noRows}><div class="empty"><lightning-icon icon-name="utility:search" size="medium"></lightning-icon><h3>No activity in this view</h3><p>Try a wider date range or another category.</p></div></template>
        <template if:true={hasMore}><div class="more"><lightning-button label="Load more" onclick={more} disabled={busy}></lightning-button></div></template>
    </section>
    <template if:true={selected}><section role="dialog" tabindex="-1" onkeydown={modalKey} aria-modal="true" aria-labelledby="audit-detail-title" class="slds-modal slds-fade-in-open"><div class="slds-modal__container"><header class="slds-modal__header"><h2 id="audit-detail-title">Activity details</h2><lightning-button label="Close" onclick={closeDetail}></lightning-button></header><div class="slds-modal__content slds-p-around_large"><dl class="details"><dt>Category / action</dt><dd>{selected.category} · {selected.action}</dd><dt>User</dt><dd>{selected.userName}</dd><dt>Time</dt><dd><lightning-formatted-date-time value={selected.occurredAt} year="numeric" month="short" day="2-digit" hour="2-digit" minute="2-digit"></lightning-formatted-date-time></dd><dt>Status</dt><dd>{selected.status}</dd><dt>Source</dt><dd>{selected.source}</dd><dt>Object / field</dt><dd>{selected.target} · {selected.field}</dd><dt>Target ID</dt><dd>{selected.recordId}</dd><dt>Classification</dt><dd>{selected.classification}</dd></dl><div class="message"><lightning-formatted-text value={selected.message}></lightning-formatted-text></div><template if:true={hasChanges}><h3>What changed</h3><p>Masking replacement patterns are redacted.</p><table class="diff"><thead><tr><th scope="col">Setting</th><th scope="col">Before</th><th scope="col">After</th></tr></thead><tbody><template for:each={changeRows} for:item="change"><tr key={change.field}><td>{change.field}</td><td>{change.before}</td><td>{change.after}</td></tr></template></tbody></table></template></div><footer class="slds-modal__footer"><lightning-button label="Done" onclick={closeDetail}></lightning-button></footer></div></section><div class="slds-backdrop slds-backdrop_open"></div></template>
</template>
