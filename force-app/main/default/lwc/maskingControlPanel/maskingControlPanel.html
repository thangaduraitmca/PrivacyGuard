<template>
<section class="pg-feature-hero" aria-label="Masking Jobs"><div class="pg-header-copy"><span class="pg-header-icon pg-header-icon--green" aria-hidden="true"><lightning-icon icon-name="utility:play" size="medium" alternative-text=""></lightning-icon></span><div class="pg-header-text"><div class="pg-feature-eyebrow">PRIVACYGUARD • MASKING OPERATIONS</div><h1>Masking Jobs</h1><p>Create, manage and monitor controlled sandbox masking jobs.</p></div></div><div class="pg-header-actions"><lightning-button variant="brand" label="Create Masking Job" icon-name="utility:add" onclick={openNew}></lightning-button></div></section><lightning-card title="Masking Control Panel" icon-name="standard:data_streams"><div class="slds-p-around_medium"><div class="slds-grid slds-wrap slds-grid_align-spread slds-m-bottom_medium"><div><h2 class="slds-text-heading_small">Reusable Masking Jobs</h2><p class="slds-text-color_weak">Group already-configured objects into controlled Full or unmasked-only masking jobs. Execution is blocked outside an approved sandbox.</p></div></div>
<template if:true={isLoading}><lightning-spinner alternative-text="Working"></lightning-spinner></template>
<template if:true={jobs.length}><div class="slds-scrollable_x"><table class="slds-table slds-table_cell-buffer slds-table_bordered"><thead><tr><th>Job</th><th>Objects</th><th>Mode</th><th>Execution</th><th>Last Run</th><th>Next Scheduled</th><th>Status</th><th>Actions</th></tr></thead><tbody><template for:each={jobs} for:item="j"><tr key={j.id}><td><strong>{j.name}</strong><div class="slds-text-body_small slds-text-color_weak">{j.description}</div></td><td>{j.objects}</td><td>{j.runMode}</td><td>{j.executionMode}</td><td><lightning-formatted-date-time value={j.lastRunAt} year="numeric" month="short" day="2-digit" hour="2-digit" minute="2-digit"></lightning-formatted-date-time></td><td><lightning-formatted-date-time value={j.nextScheduledRun} year="numeric" month="short" day="2-digit" hour="2-digit" minute="2-digit"></lightning-formatted-date-time><div class="slds-text-body_small">{j.scheduleStatus}</div></td><td><span class={j.statusClass} title={j.statusTitle}>{j.displayStatus}</span><template if:false={j.configurationReady}><div class="slds-text-body_small slds-text-color_error">{j.configurationIssue}</div></template></td><td><lightning-button-menu alternative-text="Job Actions" title="Job Actions" menu-alignment="auto" data-id={j.id} onselect={handleAction}><lightning-menu-item value="preview" label="Preview Masking"></lightning-menu-item><lightning-menu-item value="run" label="Run Now" disabled={j.runDisabled}></lightning-menu-item><template if:true={j.canRerun}><lightning-menu-item value="rerun" label="Retry Failed Records"></lightning-menu-item></template><template if:true={j.canCancel}><lightning-menu-item value="cancel" label="Cancel Running Job"></lightning-menu-item></template><lightning-menu-item value="logs" label="View Run Details"></lightning-menu-item><lightning-menu-item value="schedule" label="Schedule"></lightning-menu-item><lightning-menu-item value="unschedule" label="Cancel Schedule"></lightning-menu-item><lightning-menu-item value="edit" label="Edit Job"></lightning-menu-item><lightning-menu-item value="delete" label="Delete Job"></lightning-menu-item></lightning-button-menu></td></tr></template></tbody></table></div></template><template if:false={jobs.length}><div class="slds-box slds-theme_default slds-text-align_center slds-p-around_large"><h3 class="slds-text-heading_small">No masking jobs yet</h3><p class="slds-text-color_weak">Create a job by selecting objects that already have active Data Masking Configuration.</p></div></template></div></lightning-card>
<template if:true={showEditor}><section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open slds-modal_large"><div class="slds-modal__container"><header class="slds-modal__header"><h2 class="slds-text-heading_medium">Masking Job Configuration</h2></header><div class="slds-modal__content slds-p-around_medium"><lightning-input label="Job Name" value={jobName} onchange={handleName} required></lightning-input><lightning-textarea label="Description" value={description} onchange={handleDescription}></lightning-textarea><div class="slds-grid slds-gutters slds-m-top_small"><div class="slds-col"><lightning-combobox label="Masking Mode" value={runMode} options={runModeOptions} onchange={handleRunMode}></lightning-combobox></div><div class="slds-col"><lightning-combobox label="Execution Mode" value={executionMode} options={executionOptions} onchange={handleExecution}></lightning-combobox></div><div class="slds-col"><lightning-input type="number" min="1" max="2000" label="Batch Size" value={batchSize} onchange={handleBatch}></lightning-input></div></div><div class="slds-m-top_medium"><lightning-dual-listbox name="objects" label="Configured Objects" source-label="Available objects for masking" selected-label="Objects in this job" options={objectOptions} value={selectedObjects} onchange={handleObjects} required></lightning-dual-listbox><template if:true={hasSelectedNotReady}><div class="slds-notify slds-notify_alert slds-alert_warning slds-m-top_small" role="alert"><span class="slds-assistive-text">warning</span><lightning-icon icon-name="utility:warning" size="x-small" class="slds-m-right_x-small"></lightning-icon><span>{selectedNotReadyMessage}</span></div></template><p class="slds-text-body_small slds-text-color_weak slds-m-top_x-small">Each object requires active masking fields and a Data_Masking_Complete__c checkbox (default false). Successful masking sets the checkbox to true in the same save. Unmasked-only runs skip records already marked true. Reset the checkbox to false to process a record again. Inactive objects are shown as Not Ready. The selected order is used for Serial jobs.</p></div><div class="slds-box slds-theme_default slds-m-top_medium"><h3 class="slds-text-heading_small slds-m-bottom_small">Execution Schedule</h3><lightning-radio-group name="scheduleMode" label="Run frequency" options={scheduleOptions} value={scheduleMode} type="radio" onchange={handleScheduleMode}></lightning-radio-group><template if:true={scheduleEnabled}><div class="slds-grid slds-gutters slds-m-top_small"><div class="slds-col"><template if:true={isWeekly}><lightning-combobox label="Day of week" value={scheduleDay} options={weekdayOptions} onchange={handleScheduleDay}></lightning-combobox></template><template if:true={isMonthly}><lightning-combobox label="Day of month" value={scheduleMonthDay} options={monthDayOptions} onchange={handleMonthDay}></lightning-combobox></template></div><div class="slds-col"><lightning-input type="time" label="Execution time" value={scheduleTime} onchange={handleScheduleTime}></lightning-input></div></div><p class="slds-text-body_small slds-text-color_weak slds-m-top_x-small">Scheduling uses your Salesforce user timezone. Monthly schedules support days 1–28 or the last day of each month. Sandbox only.</p></template></div></div><footer class="slds-modal__footer"><lightning-button label="Cancel" onclick={closeEditor}></lightning-button><lightning-button class="slds-m-left_small" variant="brand" label="Save Job" onclick={save}></lightning-button></footer></div></section><div class="slds-backdrop slds-backdrop_open"></div></template>
<template if:true={showSchedule}><section role="dialog" tabindex="-1" aria-modal="true" class="slds-modal slds-fade-in-open"><div class="slds-modal__container"><header class="slds-modal__header"><h2 class="slds-text-heading_medium">Schedule Masking</h2></header><div class="slds-modal__content slds-p-around_medium"><p class="slds-m-bottom_small">Runs at your selected frequency in your Salesforce user timezone. Sandbox only.</p><lightning-combobox label="Frequency" value={scheduleFrequency} options={frequencyOptions} onchange={handleFrequency}></lightning-combobox><template if:true={isWeekly}><lightning-combobox label="Day of week" value={scheduleDay} options={weekdayOptions} onchange={handleScheduleDay}></lightning-combobox></template><template if:true={isMonthly}><lightning-combobox label="Day of month" value={scheduleMonthDay} options={monthDayOptions} onchange={handleMonthDay}></lightning-combobox></template><lightning-input type="time" label="Execution time" value={scheduleTime} onchange={handleScheduleTime}></lightning-input></div><footer class="slds-modal__footer"><lightning-button label="Cancel" onclick={closeSchedule}></lightning-button><lightning-button class="slds-m-left_small" variant="brand" label="Save Schedule" onclick={saveSchedule}></lightning-button></footer></div></section><div class="slds-backdrop slds-backdrop_open"></div></template>
<template if:true={showDetails}><section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open slds-modal_large"><div class="slds-modal__container"><header class="slds-modal__header"><h2 class="slds-text-heading_medium">Latest Run Details</h2></header><div class="slds-modal__content slds-p-around_medium"><template if:true={runDetails.run}><div class="slds-box slds-theme_shade slds-m-bottom_medium"><strong>{runDetails.run.name} — {runDetails.run.status}</strong><p>Processed: {runDetails.run.processed} &nbsp; Failed: {runDetails.run.failed}</p></div><h3 class="slds-text-heading_small slds-m-bottom_small">Object Results</h3><template for:each={runDetails.objects} for:item="o"><div key={o.id} class="slds-box slds-m-bottom_x-small"><strong>{o.objectApiName}</strong> — {o.status} &nbsp; Processed {o.processed} &nbsp; Failed {o.failed}<template if:true={o.errorSummary}><div class="slds-text-color_error">{o.errorSummary}</div></template></div></template><h3 class="slds-text-heading_small slds-m-vertical_small">Errors &amp; Admin Guidance</h3><template if:true={runDetails.logs.length}><template for:each={runDetails.logs} for:item="l"><div key={l.id} class="slds-box slds-m-bottom_small"><div><strong>{l.errorCategory}</strong> — {l.objectApiName} {l.fieldApiName}</div><div>{l.adminMessage}</div><template if:true={l.recordId}><div class="slds-text-body_small slds-text-color_weak">Record: {l.recordId}</div></template><div class="slds-m-top_x-small"><strong>Suggested action:</strong> {l.suggestedAction}</div><div class="slds-m-top_x-small"><strong>Technical details:</strong><div class="slds-text-font_monospace slds-m-top_x-small">{l.technicalDetails}</div></div></div></template></template><template if:false={runDetails.logs.length}><div class="slds-box slds-theme_shade">No record-level error log was captured for this run. Review the object Error Summary and Apex job logs for the failed object.</div></template></template><template if:false={runDetails.run}><p>No run history is available for this job.</p></template></div><footer class="slds-modal__footer"><lightning-button label="Close" onclick={closeDetails}></lightning-button></footer></div></section><div class="slds-backdrop slds-backdrop_open"></div></template>
<template if:true={showDeleteConfirm}><section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="delete-job-heading" class="slds-modal slds-fade-in-open"><div class="slds-modal__container delete-modal"><header class="slds-modal__header"><lightning-button-icon class="slds-modal__close" icon-name="utility:close" variant="bare-inverse" alternative-text="Close" onclick={cancelDelete}></lightning-button-icon><div class="delete-icon-wrap slds-m-bottom_small"><lightning-icon icon-name="utility:delete" size="small" alternative-text="Delete"></lightning-icon></div><h2 id="delete-job-heading" class="slds-text-heading_medium">Delete Masking Job?</h2></header><div class="slds-modal__content slds-p-around_large slds-text-align_center"><p>You’re about to delete <strong>“{pendingDeleteName}”</strong>.</p><p class="slds-m-top_small slds-text-color_weak">This removes only the reusable masking job and its object assignments.</p><div class="slds-box slds-theme_shade slds-m-top_medium"><strong>Your underlying Data Masking Configuration will not be deleted.</strong></div></div><footer class="slds-modal__footer slds-text-align_center"><lightning-button label="Cancel" onclick={cancelDelete}></lightning-button><lightning-button class="slds-m-left_small" variant="destructive" label="Delete Job" onclick={confirmDelete}></lightning-button></footer></div></section><div class="slds-backdrop slds-backdrop_open"></div></template>
<template if:true={showCancelConfirm}><section role="dialog" tabindex="-1" aria-modal="true" aria-label="Cancel masking job" class="slds-modal slds-fade-in-open"><div class="slds-modal__container"><header class="slds-modal__header"><h2 class="slds-text-heading_medium">Cancel Masking Job</h2></header><div class="slds-modal__content slds-p-around_medium">Cancel the active run of <strong>{pendingCancelName}</strong>? Previously committed batches cannot be rolled back.</div><footer class="slds-modal__footer"><lightning-button label="Keep Running" onclick={closeCancel}></lightning-button><lightning-button class="slds-m-left_small" variant="destructive" label="Cancel Job" onclick={confirmCancel}></lightning-button></footer></div></section><div class="slds-backdrop slds-backdrop_open"></div></template>
<template if:true={showRunConfirm}><section role="dialog" tabindex="-1" aria-modal="true" aria-label="Review masking execution" class="slds-modal slds-fade-in-open"><div class="slds-modal__container"><header class="slds-modal__header"><h2 class="slds-text-heading_medium">Review Masking Execution</h2></header><div class="slds-modal__content slds-p-around_medium"><template if:true={pendingRunJob}><p><strong>Job:</strong> {pendingRunJob.name}</p><p><strong>Masking mode:</strong> {pendingRunJob.modeLabel}</p><p><strong>Execution mode:</strong> {pendingRunJob.executionMode}</p><p><strong>Objects:</strong> {pendingRunJob.objectNames}</p><p class="slds-m-top_small slds-text-color_weak">Record counts are not estimated in this version. The job may affect every eligible record in the configured objects.</p><template if:true={pendingRunJob.isFull}><div class="slds-notify slds-notify_alert slds-alert_warning slds-m-top_medium" role="alert">Full masking can modify all eligible records in the selected objects.</div></template><div class="slds-box slds-theme_shade slds-m-top_medium">Sandbox only. Masked values cannot automatically be restored, and cancellation does not roll back committed batches.</div><lightning-input class="slds-m-top_medium" type="checkbox" label="I understand this execution may permanently change sandbox records." checked={runAcknowledged} onchange={handleRunAcknowledgement}></lightning-input></template></div><footer class="slds-modal__footer"><lightning-button label="Back" onclick={closeRunReview}></lightning-button><lightning-button class="slds-m-left_small" variant="brand" label="Start Masking" disabled={runConfirmationDisabled} onclick={confirmRun}></lightning-button></footer></div></section><div class="slds-backdrop slds-backdrop_open"></div></template>

<template if:true={showPreview}><section role="dialog" tabindex="-1" aria-modal="true" aria-label="Masking preview" class="slds-modal slds-fade-in-open slds-modal_large"><div class="slds-modal__container"><header class="slds-modal__header"><h2 class="slds-text-heading_medium">Masking Preview</h2></header><div class="slds-modal__content slds-p-around_medium"><p class="slds-m-bottom_small">Read-only sample of up to 5 eligible records you can access. No values or completion checkboxes are updated. Random replacements will differ during execution.</p><lightning-combobox label="Object" value={previewObject} options={previewOptions} onchange={changePreviewObject}></lightning-combobox><p class="slds-text-body_small slds-m-vertical_small">This sample does not validate record updates, validation rules or automation. Values longer than 500 characters are truncated.</p><template if:true={previewBusy}><lightning-spinner alternative-text="Loading preview"></lightning-spinner></template><template if:true={previewError}><div class="slds-text-color_error slds-m-top_small" role="alert">{previewError}</div></template><template if:true={previewEmpty}><p class="slds-m-top_small">No eligible records are visible for this object and job mode.</p></template><template if:true={previewRows.length}><p class="slds-m-vertical_small">Sample records: {previewCount}</p><div class="slds-scrollable_x"><table class="slds-table slds-table_cell-buffer slds-table_bordered"><thead><tr><th>Record ID</th><th>Field</th><th>Strategy</th><th>Before</th><th>After</th><th>Result</th></tr></thead><tbody><template for:each={previewRows} for:item="row"><tr key={row.key}><td>{row.recordId}</td><td>{row.fieldName}</td><td>{row.strategy}</td><td class="slds-cell-wrap">{row.beforeValue}</td><td class="slds-cell-wrap">{row.afterValue}</td><td>{row.outcome}</td></tr></template></tbody></table></div></template></div><footer class="slds-modal__footer"><lightning-button label="Close" onclick={closePreview}></lightning-button></footer></div></section><div class="slds-backdrop slds-backdrop_open"></div></template>
</template>
